name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build Anki add-on
        run: python tools/build.py
